    <circle cx="232" cy="332" r="76" fill="#ffffff"/>
    <circle cx="232" cy="332" r="62" fill="url(#markLens)" stroke="#0f4f99" stroke-width="4"/>
    <path d="M205 333l20 20 34-36" fill="none" stroke="#ffe46a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 404l58 58" stroke="url(#markHandle)" stroke-width="26" stroke-linecap="round"/>
    <path d="M296 404l20 20" stroke="#9c5b00" stroke-width="6" stroke-linecap="round" opacity=".35"/>
