    <rect x="66" y="-2" width="36" height="146" rx="16" fill="url(#markYellow)" transform="rotate(3 84 71)"/>
    <rect x="128" y="-20" width="44" height="182" rx="18" fill="url(#markSky)" transform="rotate(0 150 71)"/>
