<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daksh Inventory Pro">
  <defs>
    <linearGradient id="markBlueTop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="markBlueLeft" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f3d99"/>
    </linearGradient>
    <linearGradient id="markBlueRight" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2f7adf"/>
      <stop offset="1" stop-color="#14428a"/>
    </linearGradient>
    <linearGradient id="markGreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b7f0a1"/>
      <stop offset="1" stop-color="#66bb6a"/>
    </linearGradient>
    <linearGradient id="markYellow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#f2b93c"/>
    </linearGradient>
    <linearGradient id="markSky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8dd7ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="markGold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".35" stop-color="#ffd45c"/>
      <stop offset=".7" stop-color="#d8a22f"/>
      <stop offset="1" stop-color="#a96b11"/>
    </linearGradient>
    <linearGradient id="markLens" x1="0" x2="1" y1="0" y2="1">
