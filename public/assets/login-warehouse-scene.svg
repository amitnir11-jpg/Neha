<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-label="Modern warehouse inventory scene">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset=".48" stop-color="#cdddf5"/>
      <stop offset="1" stop-color="#123e7a"/>
    </linearGradient>
    <linearGradient id="aisle" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset=".55" stop-color="#d6e3f3"/>
      <stop offset="1" stop-color="#164279"/>
