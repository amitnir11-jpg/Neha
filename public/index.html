<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daksh Inventory v2 Login</title>
  <link rel="icon" href="/brand/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="512x512" href="/brand/app-icon.png">
  <link rel="stylesheet" href="/css/style.css?v=20260902-login-shell-v1" onerror="console.error('[DAKSH_LOGIN_ASSET] style.css failed', this.href)">
  <link rel="stylesheet" href="/professional-theme.css?v=20260908-enterprise-theme-v3">
  <link rel="stylesheet" href="/css/select-system.css?v=20260908-enterprise-select-v3">
  <link rel="stylesheet" href="/css/login.css?v=20260912-login-v9" onerror="console.error('[DAKSH_LOGIN_ASSET] login.css failed', this.href)">
  <script>
    (function () {
      var startedAt = Date.now();
      window.__DAKSH_LOGIN_BOOT__ = {
        startedAt: new Date(startedAt).toISOString(),
        markers: []
      };

      function safeStorage(key) {
        try {
          return window.localStorage ? localStorage.getItem(key) : null;
        } catch (error) {
          console.warn('[DAKSH_LOGIN_BOOT] localStorage read failed', key, error);
          return null;
        }
      }

      function mark(label, details) {
        var entry = {
          label: label,
          ms: Date.now() - startedAt,
          details: details || {}
        };
        window.__DAKSH_LOGIN_BOOT__.markers.push(entry);
      }

      window.addEventListener('error', function (event) {
        console.error('[DAKSH_LOGIN_BOOT] window error', {
          message: event.message,
          source: event.filename,
          line: event.lineno,
          column: event.colno,
          error: event.error ? event.error.stack || event.error.message : null
        });
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason || {};
        console.error('[DAKSH_LOGIN_BOOT] unhandled promise rejection', reason.stack || reason.message || reason);
      });

      mark('index.html inline diagnostics ready', {
        href: window.location.href,
        readyState: document.readyState
      });

      document.addEventListener('DOMContentLoaded', function () {
        mark('DOMContentLoaded fired', {
          page: document.body ? document.body.dataset.page : '',
          adminForm: Boolean(document.getElementById('adminLoginForm')),
          staffForm: Boolean(document.getElementById('staffLoginForm')),
          tokenPresent: Boolean(safeStorage('dakshToken')),
          userPresent: Boolean(safeStorage('dakshUser'))
        });
      });

      window.addEventListener('load', function () {
        mark('window load fired', {
          styleSheets: document.styleSheets ? document.styleSheets.length : 0,
          appScriptPresent: Boolean(document.querySelector('script[src*="/js/app.js"]'))
        });
      });
    })();
  </script>
</head>
<body data-page="login" class="login-body">
  <main class="login-shell" aria-label="Daksh Inventory authentication">
    <section class="login-panel" aria-label="Secure login">
      <div class="login-logo-lockup">
        <img class="login-logo" src="/brand/logo-app.svg" alt="Daksh Inventory Pro" loading="eager">
      </div>
      <header class="login-panel-header">
        <h1>Log In</h1>
        <p>Please enter your login details below</p>
      </header>

      <section id="licenseActivationPanel" class="license-activation hidden" aria-label="Product activation">
        <div class="license-activation-copy">
          <span class="panel-kicker">Product activation</span>
          <h3>Activate this PC</h3>
          <p id="licenseActivationText">Enter the license key assigned to this installation.</p>
        </div>
        <form id="licenseActivationForm" autocomplete="off">
          <label class="login-field">
            <span class="field-label">License Key</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 7h.01"/><path d="M10 14 21 3"/><path d="M21 3h-6v6"/><circle cx="8" cy="16" r="5"/></svg>
              <input name="licenseKey" placeholder="LICENSE-XXXX-XXXX" spellcheck="false" required>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">Email ID</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
              <input name="customerEmail" type="email" autocomplete="email">
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">Device ID</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
              <input id="licenseDeviceId" readonly>
            </span>
          </label>
          <button class="primary-button login-submit" type="submit">
            <span>Activate</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
        </form>
        <div id="licenseStatusText" class="form-message" aria-live="polite"></div>
      </section>

      <div class="login-panel-body">
        <form id="adminLoginForm" class="login-form active" autocomplete="on">
          <label class="login-field">
            <span class="field-label">Username</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input name="username" placeholder="Enter user ID" autocomplete="username" required>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">Password</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </span>
          </label>
          <div class="login-options">
            <label class="remember-option"><input type="checkbox" name="rememberMe" value="on"><span>Remember me</span></label>
            <button class="text-link" type="button" data-login-tab="reset">Forgot Password?</button>
          </div>
          <button class="primary-button login-submit" type="submit">
            <span>Log in</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
          <div class="login-divider"><span>or</span></div>
          <button class="email-button" id="emailLoginButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
            Continue with Email
          </button>
        </form>

        <form id="staffLoginForm" class="login-form" autocomplete="on">
          <label class="login-field">
            <span class="field-label">Username</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input name="username" placeholder="Enter user ID" autocomplete="username" required>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">4-digit PIN</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="Enter PIN" autocomplete="one-time-code" required>
              <button class="password-toggle" type="button" data-password-toggle aria-label="Show PIN">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </span>
          </label>
          <div class="login-options">
            <label class="remember-option"><input type="checkbox" name="rememberMe" value="on"><span>Remember me</span></label>
            <button class="text-link" type="button" data-login-tab="reset">Forgot Password?</button>
          </div>
          <button class="primary-button login-submit" type="submit">
            <span>PIN Login</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
        </form>

        <form id="dealerSelectLoginForm" class="login-form" autocomplete="off">
          <label class="login-field">
            <span class="field-label">Dealer</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/></svg>
              <select id="loginDealerSelect" name="dealerCode" required></select>
            </span>
          </label>
          <button class="primary-button login-submit" type="submit">
            <span>Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
        </form>

        <form id="registerLoginForm" class="login-form compact-form" autocomplete="on">
          <label class="login-field">
            <span class="field-label">Full Name</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input name="name" autocomplete="name" required>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">Username</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              <input name="username" autocomplete="username" required>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">Email ID</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
              <input name="email" type="email" autocomplete="email" required>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">Password</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input name="password" type="password" autocomplete="new-password">
              <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </span>
          </label>
          <label class="login-field">
            <span class="field-label">4-digit PIN</span>
            <span class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 17h.01"/><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6"/></svg>
              <input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="one-time-code">
            </span>
          </label>
          <button class="primary-button login-submit" type="submit">
            <span>Request User Login</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
        </form>

        <section id="resetLoginForm" class="login-form reset-flow" aria-label="Reset access">
          <form id="resetRequestForm" class="reset-step">
            <label class="login-field">
              <span class="field-label">Username or Email ID</span>
              <span class="input-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
                <input name="usernameOrEmail" type="text" autocomplete="username" required>
              </span>
            </label>
            <button class="primary-button login-submit" type="submit">
              <span>Send OTP Reset Link</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
            </button>
          </form>

          <form id="resetPasswordForm" class="reset-step">
            <label class="login-field">
              <span class="field-label">Email ID</span>
              <span class="input-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
                <input name="email" id="resetEmailInput" type="email" autocomplete="email" required>
              </span>
            </label>
            <label class="login-field">
              <span class="field-label">Reset Link Token</span>
              <span class="input-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 7h.01"/><path d="M10 14 21 3"/><path d="M21 3h-6v6"/><circle cx="8" cy="16" r="5"/></svg>
                <input name="token" id="resetTokenInput" autocomplete="one-time-code" required>
              </span>
            </label>
            <label class="login-field">
              <span class="field-label">OTP</span>
              <span class="input-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
                <input name="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
              </span>
            </label>
            <label class="login-field">
              <span class="field-label">New Password</span>
              <span class="input-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <input name="password" type="password" autocomplete="new-password" required>
                <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </span>
            </label>
            <button class="primary-button login-submit" type="submit">
              <span>Reset Password</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
            </button>
          </form>
        </section>

        <div id="loginMessage" class="form-message" aria-live="polite"></div>

        <div class="login-tabs" role="tablist" aria-label="Alternative login options">
          <button class="tab-button admin-tab" type="button" role="tab" aria-selected="true" aria-controls="adminLoginForm" data-login-tab="admin">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg></span>
            Admin Login
          </button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="staffLoginForm" data-login-tab="staff">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            PIN Login
          </button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="registerLoginForm" data-login-tab="register">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg></span>
            New User
          </button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="resetLoginForm" data-login-tab="reset">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12A9 9 0 0 1 18.5 5.8"/><path d="M18 2v4h4"/><path d="M6 22v-4H2"/></svg></span>
            Reset
          </button>
        </div>

        <aside class="secure-access" aria-label="Secure access">
          <span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15v2"/></svg></span>
          <div>
            <strong>Secure Access</strong>
            <small>Your data is protected with enterprise-grade security.</small>
          </div>
        </aside>
      </div>
    </section>

    <footer class="login-footer" aria-label="Copyright">
      <span>&copy; 2026 Daksh Inventory Pro. All rights reserved.</span>
    </footer>
  </main>

  <script src="/config.js"></script>
  <script src="/js/runtime.js?v=20260923-recon-upload-dashboard-v1"></script>
  <script src="/js/app.js?v=20260630-report-dealer-fix-v1" onerror="console.error('[DAKSH_LOGIN_ASSET] app.js failed', this.src)"></script>
  <script src="/js/select-system.js?v=20260908-enterprise-select-v3"></script>
</body>
</html>
