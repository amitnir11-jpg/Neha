org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# Flutter plugins are compiled from the shared Pub cache, outside the Android
# project root. Disable Kotlin's relocatable incremental cache so release APK
# builds do not fail when resolving those source paths on Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
